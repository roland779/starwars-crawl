<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Star Wars Crawl</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="stars"></canvas>

  <div class="language-switch" aria-label="Language selection">
    <button class="language-option active" type="button" data-lang="de" aria-pressed="true">DE</button>
    <button class="language-option" type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>

  <div class="container">
    <div class="title-section">
      <h1 class="title">STAR WARS</h1>
      <p class="subtitle" id="pageSubtitle"></p>
    </div>

    <button id="startBtn"></button>

    <div class="crawl-wrapper" id="crawlWrapper">
      <div class="crawl-content" id="crawlContent">
        <div class="episode-number" id="episodeNumber"></div>
        <div class="episode-title" id="episodeTitle"></div>
        <div class="crawl-text" id="crawlText"></div>
      </div>
    </div>

    <div class="controls" id="controls">
      <button id="prevBtn"></button>
      <span id="episodeIndicator">1 / 3</span>
      <button id="nextBtn"></button>
    </div>

    <div class="attribution" id="attribution"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
